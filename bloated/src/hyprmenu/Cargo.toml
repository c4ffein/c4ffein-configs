[package]
name = "hyprmenu"
version = "0.2.0"
edition = "2021"
description = "Resident fuzzy launcher for Hyprland: Wayland + OpenGL ES + GLSL, no toolkit"

[dependencies]
# Wayland. The system backend (libwayland via dlopen) is required so Mesa's EGL gets real wl_display/wl_surface pointers.
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-egl = "0.32"
# GL: EGL loaded at runtime, GLES2 calls through glow
khronos-egl = { version = "6", features = ["dynamic"] }
libloading = "0.8"
glow = "0.16"
# input
xkbcommon = { version = "0.8", features = ["wayland"] }
# text
freetype-rs = "0.37"
# daemon plumbing
inotify = "0.11"
libc = "0.2"

[profile.release]
opt-level = 2
debug = 1
